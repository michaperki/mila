# Builds a new preview app when the native layer (fingerprint) changed; otherwise publishes
# an over-the-air update. Pushes to main are handled by GitHub Actions
# (.github/workflows/mobile-preview-update.yml), so this only runs by hand:
#   npx eas-cli@latest workflow:run .eas/workflows/preview.yml
name: Ship to preview

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview
  get_ios_build:
    name: Find a compatible iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: preview
  build_ios:
    name: Build iOS (native layer changed)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: preview
      platform: ios
