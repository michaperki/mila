<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mila debug viewer</title>
<style>
  :root { --ink: #1d2a22; --muted: #6b7a70; --line: #dfe6e0; --paper: #f7f9f6; --green: #2f7d4f; --red: #b3412f; --label: 190px; }
  * { box-sizing: border-box; }
  /* The page's own display rules must never show what `hidden` hides (the sign-in form did). */
  [hidden] { display: none !important; }
  body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--green); }
  .muted { color: var(--muted); }
  #login { max-width: 320px; margin: 60px auto; background: #fff; padding: 20px; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 8px; }
  #login input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* The whole session, always in view: where activity is, which stretch the chart shows. */
  #overview { position: relative; height: 74px; background: #fff; border-bottom: 1px solid var(--line); cursor: crosshair; user-select: none; }
  #overview .row { position: absolute; left: var(--label); right: 12px; }
  #overview .name { position: absolute; left: 12px; font-size: 11px; color: var(--muted); }
  #overview .bin { position: absolute; bottom: 0; }
  #overview .act { position: absolute; top: 0; width: 2px; height: 10px; }
  #window { position: absolute; top: 2px; bottom: 2px; border: 1.5px solid var(--ink); background: rgba(47,125,79,.08); border-radius: 3px; pointer-events: none; }
  #ocursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--red); pointer-events: none; }
  #body { flex: 1; display: grid; grid-template-columns: 300px 1fr 380px; min-height: 0; }
  #actions { overflow: auto; border-right: 1px solid var(--line); background: #fff; }
  .entry { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .entry:hover { background: #f4f8f5; }
  .entry.on { background: #e8f2ea; }
  .entry .title { font-weight: 600; }
  .entry .sum { color: var(--muted); font-size: 12px; }
  .entry.child { padding-left: 26px; }
  .entry.bg { color: var(--muted); }
  details.bg > summary { list-style: none; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; color: var(--muted); font-size: 12px; }
  details.bg > summary::before { content: '▸ '; }
  details.bg[open] > summary::before { content: '▾ '; }
  #center { display: flex; flex-direction: column; min-width: 0; }
  #controls { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: #fff; }
  #controls input[type=range] { flex: 1; }
  #chart { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; background: #fff; }
  #axis { position: sticky; top: 0; height: 20px; background: #fff; border-bottom: 1px solid var(--line); z-index: 3; }
  .tickmark { position: absolute; top: 0; height: 20px; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding-left: 3px; white-space: nowrap; }
  .lane-head { padding: 3px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #fbfcfb; border-bottom: 1px solid var(--line); }
  .row { position: relative; height: 22px; border-bottom: 1px solid #f0f3f0; }
  .row .label { position: absolute; left: 0; width: var(--label); padding: 0 8px 0 12px; height: 22px; line-height: 22px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; cursor: pointer; background: #fff; z-index: 1; border-right: 1px solid var(--line); }
  .row .label:hover { color: var(--green); }
  .row.member .label { padding-left: 28px; color: var(--muted); }
  .bar { position: absolute; top: 3px; height: 16px; border-radius: 3px; min-width: 2px; opacity: .88; cursor: pointer; font-size: 10px; line-height: 16px; color: #fff; padding: 0 3px; overflow: hidden; white-space: nowrap; }
  .bar.tick { width: 2px !important; padding: 0; }
  .bar.dim { opacity: .15; }
  .bar.chosen { outline: 2px solid var(--ink); opacity: 1; }
  #cursor { position: absolute; top: 0; width: 1px; background: var(--red); z-index: 4; pointer-events: none; }
  aside { overflow: auto; padding: 10px 16px; border-left: 1px solid var(--line); background: var(--paper); }
  aside h2 { font-size: 12px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 2px 8px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .he { direction: rtl; font-size: 15px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #eef2ee; padding: 8px; border-radius: 6px; max-height: 360px; overflow: auto; font-size: 11px; }
  .item { padding: 4px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .mode { border-radius: 6px; }
  .mode.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* Replay: Mila's Reader as recorded, with the lookup's data flow around it. */
  #replay { flex: 1; overflow: auto; background: #fff; display: flex; flex-direction: column; }
  .rp-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .rp-bar input[type=range] { flex: 1; }
  .rp-stage { position: relative; display: grid; grid-template-columns: 1fr 300px 1fr; gap: 28px; padding: 22px 18px; align-items: start; min-height: 520px; }
  .rp-col { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 2; }
  .rp-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .node { border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
  .node .nt { font-weight: 700; font-size: 12px; }
  .node .ns { font-size: 12px; color: var(--muted); }
  .node .nm { font-size: 11px; color: var(--muted); }
  .node.st-waiting { opacity: .45; }
  .node.st-unused { opacity: .3; border-style: dashed; }
  .node.st-running { border-color: #c9892b; background: #fff7e8; }
  .node.st-done { border-color: var(--green); background: #f0f8f2; }
  .node.st-failed { border-color: var(--red); background: #fbefec; }
  .node.picked { box-shadow: 0 0 0 2px var(--ink); }
  .promptbtn { margin-top: 6px; background: #8a5aa8; color: #fff; border-color: #8a5aa8; font-weight: 600; }
  .phone { position: relative; z-index: 2; border: 2px solid var(--ink); border-radius: 26px; padding: 14px 14px 0; background: #fbfcfa; min-height: 480px; display: flex; flex-direction: column; overflow: hidden; }
  .ph-top { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 10px; }
  .ph-text { direction: rtl; font-size: 19px; line-height: 1.8; padding: 8px; border-radius: 8px; background: #eef6ef; }
  .ph-text .w.tapped { background: #2f7d4f; color: #fff; border-radius: 4px; padding: 0 3px; }
  .ph-q { font-size: 11px; color: var(--muted); margin: 8px 2px; }
  .ph-drawer { margin-top: auto; border-top: 1px solid var(--line); background: #fff; margin-left: -14px; margin-right: -14px; padding: 12px 16px 18px; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 12px rgba(0,0,0,.06); min-height: 120px; }
  .ph-drawer .dw { direction: rtl; font-size: 22px; font-weight: 700; }
  .ph-drawer.closed { background: transparent; box-shadow: none; color: var(--muted); font-size: 12px; }
  #modal { position: fixed; inset: 0; background: rgba(20,30,24,.45); z-index: 20; display: flex; align-items: center; justify-content: center; }
  #modal .box { background: #fff; width: min(900px, 92vw); max-height: 86vh; overflow: auto; border-radius: 12px; padding: 16px 20px; }
  #modal pre { max-height: none; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 999px; background: #e6eee8; font-size: 11px; margin-right: 4px; }
  /* Usage: how Mila is used, from the always-on usage events (debug-usage.js). */
  #usage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  #usageMain { overflow: auto; padding: 0 16px 40px; }
  #usageSide { overflow: auto; padding: 10px 16px; border-left: 1px solid var(--line); background: var(--paper); }
  .u-bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 8px 0; background: var(--paper); border-bottom: 1px solid var(--line); }
  .u-bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .u-bar input[type=number] { width: 60px; }
  .u-coverage { margin: 12px 0; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .u-coverage summary { cursor: pointer; color: var(--muted); margin-top: 4px; }
  .u-section { margin-top: 18px; }
  .u-section h2 { font-size: 13px; margin: 0 0 2px; }
  .u-section .note { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  table.u { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  table.u th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.u td { padding: 4px 8px; border-bottom: 1px solid #f0f3f0; vertical-align: top; }
  table.u tr.click { cursor: pointer; }
  table.u tr.click:hover td { background: #f4f8f5; }
  table.u tr.on td { background: #e8f2ea; }
  table.u td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { display: inline-block; width: 60px; height: 6px; background: #e6eee8; border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--green); }
  .zero { color: var(--red); font-weight: 600; }
  .seq { font-size: 12px; }
  .seq .ev { display: grid; grid-template-columns: 64px 52px 1fr; gap: 6px; padding: 3px 4px; border-bottom: 1px dashed var(--line); }
  .seq .ev.here { background: #fff4d6; border-radius: 4px; }
  .seq .ev.span { background: #fffaea; }
  .seq .ev.appear { color: var(--muted); }
  .chips { line-height: 1.9; }
  .chips .step { display: inline-block; padding: 0 7px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfb; font-size: 12px; line-height: 18px; }
  .chips .step.back { border-color: #e4b7ad; background: #fbefec; }
  .chips .step.pick { border-color: #b9d8c3; }
  .chips .sep { color: var(--muted); margin: 0 2px; font-size: 11px; }
  .kind { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .u-warn { border-color: #e4b7ad !important; background: #fbefec !important; }
  .u-ok { border-color: #b9d8c3 !important; background: #f0f8f2 !important; }
  .seq .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .seq .k { color: var(--muted); }
  .times { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
  .times span { padding: 0 5px; border-radius: 4px; background: #e6eee8; font-size: 11px; cursor: pointer; }
  .times span.hit { background: var(--red); color: #fff; }
  .times span.other { background: #f0f0f0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mila debug viewer</h1>
  <span id="views" hidden><button id="viewCaptures" class="mode on">Captures</button><button id="viewUsage" class="mode">Usage</button></span>
  <span id="who" class="muted"></span>
  <select id="captures" hidden></select>
  <button id="refresh" hidden>Refresh</button>
  <span id="status" class="muted"></span>
  <span style="flex:1"></span>
  <button id="signout" hidden>Sign out</button>
</header>
<form id="login" hidden>
  <strong>Sign in with your Mila developer account</strong>
  <input id="email" type="email" placeholder="Email" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <span id="loginError" style="color:var(--red)"></span>
</form>
<div id="app" hidden>
  <div id="overview" title="The whole session: click to move the chart here, drag to choose a stretch"></div>
  <div id="body">
    <nav id="actions"></nav>
    <section id="center">
      <div id="controls">
        <button id="modeTimeline" class="mode on">Timeline</button><button id="modeReplay" class="mode">Replay</button>
        <span id="timelineOnly" style="display:contents">
          <button id="all">Whole session</button>
          <span class="muted">Moment</span><input id="scrub" type="range" min="0" max="1000" value="0">
          <span id="at" class="muted" style="min-width:96px"></span>
          <span id="span" class="muted"></span>
        </span>
        <span id="replayNote" class="muted" hidden>The scrubber below moves the phone and the lookup’s path together.</span>
      </div>
      <div id="chart"><div id="axis"></div><div id="rows"></div><div id="cursor"></div></div>
      <div id="replay" hidden></div>
    </section>
    <aside id="side"></aside>
  </div>
</div>
<div id="usage" hidden><section id="usageMain"></section><aside id="usageSide"></aside></div>
<div id="modal" hidden></div>
<script>
// Reads one debug capture (functions/debug-trace.ts). Above, the whole session (where activity
// is, and the stretch the chart shows); left, what was done, in order, each action with the work it
// set off summed up beneath it, and work with no known action in collapsed entries; centre, the
// chart of the chosen stretch fitted to its width, its spans grouped by lane and operation (a
// group's bar is when any of it was active, so idle gaps show), each group expandable to its
// spans; right, the screen at the chosen moment, what was in progress, and the chosen span's or
// group's details. Server times are set inside the request they belong to (the clocks differ).
const API = '/.netlify/functions/'
const LANES = [['state', 'Screen'], ['action', 'Actions'], ['phone', 'Phone'], ['net', 'Network'], ['server', 'Server'], ['db', 'Database'], ['ai', 'AI']]
const $ = id => document.getElementById(id)
let token = sessionStorage.getItem('milaDebugToken')
// Captures (one debug capture, below) or Usage (the always-on usage events, debug-usage.js).
let view = sessionStorage.getItem('milaDebugView') === 'usage' ? 'usage' : 'captures'
let listed = false
let data = null, spans = [], t0 = 0, t1 = 1, w0 = 0, w1 = 1, cursor = 0, chosen = null, focus = null
const expanded = new Set()
const acts = new Map(), rootOf = new Map()

async function api(path, init = {}) {
  const response = await fetch(API + path, { ...init, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) } })
  const body = await response.json().catch(() => ({}))
  if (response.status === 401 && token) { signOut(); throw new Error('Signed out: sign in again.') }
  if (!response.ok) throw new Error(body.message || `Failed (${response.status})`)
  return body
}
function signOut() { token = null; sessionStorage.removeItem('milaDebugToken'); sessionStorage.removeItem('milaDebugWho'); show() }
async function show() {
  const signedIn = !!token
  $('login').hidden = signedIn
  for (const id of ['signout', 'views']) $(id).hidden = !signedIn
  $('who').textContent = signedIn ? sessionStorage.getItem('milaDebugWho') || '' : ''
  if (!signedIn) { listed = false; $('app').hidden = true; $('usage').hidden = true; for (const id of ['captures', 'refresh']) $(id).hidden = true; return }
  await setView(view)
}
async function setView(next) {
  view = next; sessionStorage.setItem('milaDebugView', view)
  $('viewCaptures').classList.toggle('on', view === 'captures'); $('viewUsage').classList.toggle('on', view === 'usage')
  $('app').hidden = view !== 'captures'; $('usage').hidden = view !== 'usage'
  for (const id of ['captures', 'refresh']) $(id).hidden = view !== 'captures'
  $('status').textContent = ''
  if (view === 'usage') { await window.showUsage?.(); return }
  if (!listed) { listed = true; await loadList().catch(error => { listed = false; $('status').textContent = error.message }) }
}
$('viewCaptures').onclick = () => setView('captures')
$('viewUsage').onclick = () => setView('usage')
$('login').onsubmit = async event => {
  event.preventDefault(); $('loginError').textContent = ''
  try {
    const result = await api('auth', { method: 'POST', body: JSON.stringify({ email: $('email').value, password: $('password').value, mode: 'login' }) })
    token = result.token
    sessionStorage.setItem('milaDebugToken', token); sessionStorage.setItem('milaDebugWho', result.user.email)
    $('password').value = ''
    await show()
  } catch (error) { $('loginError').textContent = error.message }
}
$('signout').onclick = signOut
$('refresh').onclick = () => loadList(true)
$('captures').onchange = () => loadCapture($('captures').value)
$('all').onclick = () => { focus = null; setWindow(t0, t1); list() }

const time = at => { const d = new Date(at); return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0') }
const ms = n => (n < 1000 ? `${Math.round(n)} ms` : n < 120000 ? `${(n / 1000).toFixed(1)} s` : `${Math.round(n / 60000)} min`)
const esc = text => String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const cap = text => String(text).charAt(0).toUpperCase() + String(text).slice(1)

async function loadList(keep) {
  const { captures } = await api('debug-trace')
  const was = $('captures').value
  $('captures').innerHTML = captures.map(c => `<option value="${c.id}">${new Date(c.startedAt).toLocaleString()} · ${c.id} · ${c.spans} spans${c.prompts ? ' · prompts' : ''}${c.stoppedAt ? '' : ' · on'}</option>`).join('')
  if (!captures.length) { $('status').textContent = 'No captures yet: start one in Mila Preview, Account → Debug capture.'; return }
  const id = keep && captures.some(c => c.id === was) ? was : captures[0].id
  $('captures').value = id
  await loadCapture(id, keep)
}

// Server spans (server clock) placed inside the phone's request they belong to.
function align(list) {
  const nets = new Map(list.filter(s => s.kind === 'net' && s.request).map(s => [s.request, s]))
  const offsets = new Map(), all = []
  for (const s of list) if (s.side === 'server' && s.kind === 'server' && nets.has(s.request)) {
    const n = nets.get(s.request), off = (n.start + n.end) / 2 - (s.start + s.end) / 2
    offsets.set(s.request, off); all.push(off)
  }
  all.sort((a, b) => a - b)
  const usual = all.length ? all[Math.floor(all.length / 2)] : 0
  return list.map(s => (s.side === 'server' ? { ...s, start: s.start + (offsets.get(s.request) ?? usual), end: s.end + (offsets.get(s.request) ?? usual), aligned: offsets.has(s.request) } : s))
}
async function loadCapture(id, keep) {
  $('status').textContent = 'Loading…'
  data = await api(`debug-trace?capture=${encodeURIComponent(id)}`)
  spans = align(data.spans).map((s, i) => ({ ...s, i, end: Math.max(s.end ?? s.start, s.start) }))
  acts.clear(); rootOf.clear()
  for (const s of spans) if (s.kind === 'action') acts.set(s.action, s)
  // An action's root: the action at the top of what set it off (a prefetch's, its selection's).
  for (const id of acts.keys()) { let a = acts.get(id), guard = 0; while (a.parent && acts.has(a.parent) && guard++ < 20) a = acts.get(a.parent); rootOf.set(id, a.action) }
  t0 = Math.min(...spans.map(s => s.start), data.capture.startedAt); t1 = Math.max(...spans.map(s => s.end), t0 + 1000)
  if (!keep) { focus = null; chosen = null; picked = null; replayAct = null; expanded.clear(); w0 = t0; w1 = t1; cursor = t0 }
  else if (replayAct) { replayAct = acts.get(replayAct.action) ?? null; $('replay').dataset.act = '' }
  $('status').textContent = `${spans.length} spans · ${ms(t1 - t0)}${data.capture.prompts ? ' · with exact prompts' : ''}`
  if (mode === 'replay' && !keep) { setMode('replay'); return }
  list(); setWindow(keep ? w0 : t0, keep ? w1 : t1)
}

// What a span belongs to: its action's root, or none (background work).
// (A server span whose phone action hasn't arrived yet still belongs to that action.)
const rootFor = s => (s.action ? rootOf.get(s.action) ?? s.action : null)
const workOf = root => spans.filter(s => s.kind !== 'action' && s.kind !== 'state' && rootFor(s) === root)
const hue = id => { let h = 7; for (const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360 }
const colorOf = root => (root ? `hsl(${hue(root)} 55% 42%)` : '#98a39c')
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`
// A short account of work: requests by operation, AI calls and their cost, work done on the phone.
function summary(work, from) {
  const nets = work.filter(s => s.kind === 'net'), ai = work.filter(s => s.kind === 'ai'), phone = work.filter(s => s.kind === 'phone')
  const byName = new Map(); for (const s of nets) byName.set(s.name, (byName.get(s.name) || 0) + 1)
  const parts = [...byName].sort((a, b) => b[1] - a[1]).map(([name, n]) => `${n} ${name}`)
  if (ai.length) { const cost = ai.reduce((sum, s) => sum + (Number(s.fields?.cost) || 0), 0); parts.push(`${plural(ai.length, 'AI call')}${cost ? ` ($${cost.toFixed(3)})` : ''}`) }
  if (phone.length) parts.push(`${phone.length} on the phone`)
  const end = Math.max(from, ...work.map(s => s.end))
  return `${parts.join(' · ') || 'nothing more'}${work.length ? ` · ${ms(end - from)}` : ''}`
}
const windowOf = (from, work) => { const end = Math.max(from + 300, ...work.map(s => s.end)); const pad = Math.max(150, (end - from) * 0.06); return [from - pad, end + pad] }

// The action list: each action whose root it is, its child actions beneath it, and background
// work (no known action) in collapsed entries, gathered where it comes close together.
function list() {
  const replaying = mode === 'replay' ? replayAct?.action : null

// The whole session: bars where requests and AI calls were active (by how much of each slice of

}
function showPrompt(s) {
  const p = s.prompt || {}
  const user = (p.messages || []).map(m => `${m.role}:\n${typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2)}`).join('\n\n')
  const system = Array.isArray(p.system) ? p.system.map(x => x.text || '').join('\n') : p.system || ''
  $('modal').innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Exact request sent to Claude · ${esc(s.name)} · ${time(s.start)}</strong><button id="closeModal">Close</button></div>
    ${kv({ model: p.model, 'max tokens': p.max_tokens, why: s.fields?.why, cost: s.fields?.cost != null ? `$${Number(s.fields.cost).toFixed(4)}` : undefined })}
    <h2>Message</h2><pre style="direction:rtl;text-align:right">${esc(user)}</pre>
    <details><summary>System prompt (${system.length} characters)</summary><pre>${esc(system)}</pre></details>
    <details><summary>Everything, as sent</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details></div>`

$('modal').onclick = e => { if (e.target === $('modal')) $('modal').hidden = true }
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('modal').hidden = true

})
// The moments worth stopping at: each start and end in the lookup, and each change of the Reader.
function moments() {
  const a = replayAct, sel = selectionOf(a), work = [...lookupWork(a), ...(sel ? lookupWork(sel) : [])]
  return [...new Set([a.start, ...work.flatMap(s => [s.start, s.end]), ...readerStates().map(s => s.start)].filter(t => t >= w0 && t <= w1))].sort((x, y) => x - y)
}
function step(dir) {
  const list = moments(), next = dir > 0 ? list.find(t => t > cursor + 0.5) : [...list].reverse().find(t => t < cursor - 0.5)

}
// The lookup's steps, from its spans: each one's span, what set it off, its state at the moment and its outcome.
const relTo = (a, t) => (t >= a.start ? `+${ms(t - a.start)}` : `−${ms(a.start - t)}`)
function replayModel(a) {
  const work = lookupWork(a), sel = selectionOf(a), selWork = sel ? lookupWork(sel) : []
  const get = (list, test) => list.find(test) || null
  const request = get(work, s => s.kind === 'net' && s.name === 'word-analysis')
  const n = {
    tap: { title: 'Tap', span: a, why: 'You tapped the word in the Reader' },
    quick: { title: 'Quick meanings', span: get(selWork, s => s.kind === 'net' && s.name === 'sentence-glosses') || get(selWork, s => s.kind === 'phone'), why: sel ? `Selecting the sentence (“${sel.name}” at ${time(sel.start)}): its words’ quick meanings, asked once for the sentence` : 'Asked when the sentence was selected, before this tap' },
    phone: { title: 'On the phone', span: get(work, s => s.kind === 'phone'), why: 'The tap, answered from what the phone already had' },
    request: { title: 'Lookup request', span: request, why: 'The tap: the phone had no explanation of this word here' },
    reply: { title: 'Reply to the drawer', span: request, why: 'The function’s answer arriving on the phone' },
    server: { title: 'word-analysis function', span: get(work, s => s.kind === 'server' && s.name === 'word-analysis'), why: 'The lookup request reaching the server' },
    memory: { title: 'Function memory', span: get(work, s => s.kind === 'server' && s.name === 'instance memory'), why: 'The function looks in what this instance already explained' },
    cache: { title: 'Cache check', span: get(work, s => s.kind === 'db' && s.name.startsWith('aiCache.findOne')), why: 'The function looks for this word in this sentence in the shared cache' },
    spend: { title: 'Daily spend check', span: get(work, s => s.kind === 'db' && s.name.startsWith('aiUsage')), why: 'Not in the cache: today’s AI spend is checked before asking Claude' },
    claude: { title: 'Claude', span: get(work, s => s.kind === 'ai'), why: 'Not in the cache, and within today’s limit' },
    store: { title: 'Cache write', span: get(work, s => s.kind === 'db' && s.name.startsWith('aiCache.updateOne')), why: 'Claude’s explanation, kept for next time' },
  }
  const st = key => { const node = n[key]; if (key === 'reply') return !request ? 'unused' : cursor < request.end ? 'waiting' : statusOf(request, cursor); return statusOf(node.span, cursor) }
  const outcome = key => {
    const s = n[key].span, f = s?.fields || {}
    if (!s) return key === 'phone' ? 'not needed' : key === 'memory' ? 'not this time' : 'not used'
    switch (key) {
      case 'tap': return `word ${s.fields?.place != null ? s.fields.place + 1 : ''} of sentence ${s.fields?.segment != null ? s.fields.segment + 1 : ''}`
      case 'quick': return s.kind === 'phone' ? s.source : `${f.status ?? ''} · ${ms(s.end - s.start)}`
      case 'phone': return s.source
      case 'request': return `sends ${(f.sent || []).join(', ') || '—'}`
      case 'reply': return st('reply') === 'waiting' ? 'not back yet' : `${f.status} · ${f.bytes ? Math.round(f.bytes / 100) / 10 + ' kB' : ''}`
      case 'server': return `status ${f.status ?? '…'}`
      case 'memory': return 'answered from this instance’s memory'
      case 'cache': return f.hit ? 'answered before: no AI needed' : 'not there: ask Claude'
      case 'spend': return 'within today’s limit'
      case 'claude': return f.failed ? `failed: ${f.failed}` : `${f.inputTokens ?? '?'} in · ${f.outputTokens ?? '?'} out${f.cacheWriteTokens ? ` · ${f.cacheWriteTokens} cached` : ''} · $${Number(f.cost || 0).toFixed(4)}`

// The step clicked, as it is at the current moment (the side panel's top).
function stepDetails() {
  const a = replayAct, m = replayModel(a), node = m.n[picked], s = node.span, status = m.st(picked)
  const when = picked === 'reply' ? s?.end : s?.start
  let html = `<h2>Step · ${esc(node.title)}</h2>` + kv({
    'right now': status === 'unused' ? 'not used for this tap' : status,
    [status === 'unused' ? 'used when' : 'set off by']: node.why,
    [picked === 'reply' ? 'arrived' : 'started']: s && when !== undefined ? `${relTo(a, when)} after the tap · ${time(when)}` : undefined,
    took: s && picked !== 'tap' && picked !== 'reply' ? (s.end > s.start ? ms(s.end - s.start) : 'instant') : undefined,
    outcome: m.outcome(picked),
    'came from': s?.source,
  })
  const prompt = s && promptFor(s)
  if (prompt) html += `<button class="promptbtn" data-prompt="${prompt.i}">View exact prompt</button>`
  else if (picked === 'claude' && s) html += `<div class="muted">Exact prompt not kept: start a capture with “Exact AI prompts” on to keep it.</div>`
  if (s?.kind === 'net' && s.fields?.sent && picked === 'request') html += `<h2>Data sent</h2>` + sentValues(s)
  if (s?.fields) html += `<details><summary class="muted">All fields</summary>${kv(s.fields)}</details>`

}
function renderReplay() {
  const a = replayAct
  if (!a) return
  const { n, st, outcome, request } = replayModel(a)
  const rel = t => relTo(a, t)
  const node = key => { const s = n[key].span, status = st(key), when = key === 'reply' ? request?.end : s?.start
    const prompt = key === 'claude' && s?.prompt
    return `<div class="node st-${status}${picked === key ? ' picked' : ''}" data-node="${key}" id="node-${key}">
      <div class="nt">${n[key].title} <span class="nm">${status === 'unused' ? '' : status}</span></div>
      <div class="ns">${esc(outcome(key) || '')}</div>
      ${s && when !== undefined ? `<div class="nm">${rel(when)}${key !== 'reply' && key !== 'tap' && s.end > s.start ? ` · took ${ms(s.end - s.start)}` : ''}</div>` : ''}
      ${prompt ? `<button class="promptbtn" data-prompt-node="claude">View exact prompt</button>` : ''}</div>` }
  // The Reader as recorded at this moment.
  const state = [...readerStates()].filter(s => s.start <= cursor).pop()?.state
  const tappedWord = (readerStates().find(s => s.start >= a.start && s.state.drawer)?.state.drawer?.word) || ''
  const drawer = state?.drawer
  const tokens = String(state?.sentence?.text || '').split(/(\s+)/)
  const text = state?.sentence ? tokens.map(t => (/^\s+$/.test(t) ? t : `<span class="w${drawer && bare(t) && bare(t) === bare(drawer.word) ? ' tapped' : ''}">${esc(t)}</span>`)).join('') : '<span class="muted">No sentence selected</span>'
  const replyAt = request?.end
  // When this tap's drawer first showed, and when it closed again (screen states after the tap).
  const after = readerStates().filter(x => x.start >= a.start)
  const openedAt = after.find(x => x.state.drawer)?.start
  const closedAt = openedAt !== undefined ? after.find(x => x.start > openedAt && !x.state.drawer)?.start : undefined
  const closedNote = cursor < (openedAt ?? Infinity) ? 'Opening the drawer…'
    : closedAt !== undefined && replyAt !== undefined && closedAt < replyAt ? (cursor < replyAt ? 'Drawer closed before the explanation came back' : 'The explanation came back after the drawer was closed: kept for the next tap of this word here')
      : 'Drawer closed'

    ? `<div class="ph-drawer"><div class="dw">${esc(drawer.word)}</div>
       <div style="margin-top:6px">${drawer.explained ? '<strong>Explanation ready</strong><div class="muted" style="font-size:11px">Its text isn’t in the capture.</div>' : drawer.loading ? (state.quickMeanings === 'ready' ? 'Quick meaning shown · explanation loading…' : 'Loading…') : drawer.meaning ? 'Meaning shown' : ''}</div></div>`
    : `<div class="ph-drawer closed">${closedNote}</div>`

    const all = lookups()
    $('replay').innerHTML = `<div class="rp-bar">
        <select id="rpPick" title="Lookup to replay">${all.map(x => { const w = readerStates().find(s => s.start >= x.start && s.state.drawer)?.state.drawer.word; return `<option value="${x.action}"${x === a ? ' selected' : ''}>${time(x.start)} · ${esc(w || x.name)}${spans.some(s => s.kind === 'ai' && s.action === x.action) ? ' · Claude' : ''}</option>` }).join('')}</select>
        <button id="rpPrev" title="Previous step (←)">◀</button><input id="rpScrub" type="range" min="0" max="1000" title="Moment: moves the phone and the path"><button id="rpNext" title="Next step (→)">▶</button>
        <span id="rpAt" class="muted" style="min-width:150px"></span></div>
      <div id="rpBody"></div>
      <div class="muted" style="padding:0 18px 16px">Arrows light up as the work reaches each step; dashed steps weren’t used for this tap. Click a step for its details, or ◀ ▶ (or the arrow keys) to go step by step.</div>`
    $('replay').dataset.act = a.action

  }

      <div class="rp-col">${['tap', 'quick', 'phone', 'request', 'reply'].map(node).join('')}</div>
      <div class="phone" id="node-drawer"><div class="ph-top"><span>Reader · sentence ${state?.sentence ? state.sentence.index + 1 : '–'}</span><span>EN · ${esc(state?.english || '')}</span></div>
        <div class="ph-text">${text}</div><div class="ph-q">Quick meanings: ${esc(state?.quickMeanings || '–')}</div>${drawerHtml}</div>
      <div class="rp-col">${['server', 'memory', 'cache', 'spend', 'claude', 'store'].map(node).join('')}</div>
    </div>

  for (const el of $('rpBody').querySelectorAll('[data-node]')) el.onclick = e => {

  const lit = key => key === 'drawer' ? (request ? cursor >= request.end : !!n.phone.span && cursor >= n.phone.span.start) : !['waiting', 'unused'].includes(st(key))

    let lines = '<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f7d4f"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c7d0c9"/></marker></defs>'
    const column = key => (['tap', 'quick', 'phone', 'request', 'reply'].includes(key) ? 'left' : key === 'drawer' ? 'centre' : 'right')

      const a1 = centre(from, cf === ct ? 'centre' : cf === 'left' ? 'right' : 'left'), b1 = centre(to, cf === ct ? 'centre' : ct === 'left' ? 'right' : ct === 'right' ? 'left' : cf === 'left' ? 'left' : 'right')
      if (!a1 || !b1) continue

      const d = cf === ct ? `M${a1.x},${a1.r.bottom - box.top} L${b1.x},${b1.r.top - box.top - 2}` : `M${a1.x},${a1.y} C${(a1.x + b1.x) / 2},${a1.y} ${(a1.x + b1.x) / 2},${b1.y} ${b1.x},${b1.y}`
      lines += `<path d="${d}" fill="none" stroke="${on ? '#2f7d4f' : '#c7d0c9'}" stroke-width="${on ? 2.5 : 1.5}" ${on ? '' : 'stroke-dasharray="4 4"'} marker-end="url(#${on ? 'ah' : 'ag'})"/>`

}
